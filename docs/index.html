<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambaser</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.6 system-ui, sans-serif; background: light-dark(#f5f5f7, #17171a); color: light-dark(#1d1d1f, #f2f2f5); }
    main { max-width: 520px; padding: 32px 24px; text-align: center; }
    img { width: 96px; height: 96px; }
    h1 { margin: 16px 0 4px; font-size: 32px; }
    p { margin: 8px 0; color: light-dark(#555, #aaa); }
    .btn { display: inline-block; margin: 24px 0 8px; padding: 12px 28px; border-radius: 10px; background: #2f6fed; color: #fff; font-weight: 600; text-decoration: none; }
    .btn:hover { background: #2559c4; }
    ol { text-align: left; display: inline-block; margin: 16px 0 0; }
    code { padding: 2px 6px; border-radius: 4px; background: light-dark(#e6e6ea, #2a2a30); }
    a { color: inherit; }
    h1 small { font-size: 14px; font-weight: 500; color: light-dark(#777, #999); }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="">
    <h1>Ambaser <small id="version"></small></h1>
    <p>Browser buatan sendiri berbasis Electron, dengan fitur Jam untuk nonton dan dengar bareng teman.</p>
    <a class="btn" href="https://github.com/samuelhusein/Ambaser/archive/refs/heads/main.zip">Download ZIP</a>
    <p><small>Kode sumber dari branch <code>main</code> · <a href="https://github.com/samuelhusein/Ambaser">GitHub</a></small></p>
    <ol>
      <li>Install <a href="https://nodejs.org">Node.js</a>, lalu ekstrak ZIP.</li>
      <li>Di folder hasil ekstrak: <code>npm install</code></li>
      <li>Jalankan: <code>npm start</code></li>
    </ol>
  </main>
  <script>
    fetch("https://raw.githubusercontent.com/samuelhusein/Ambaser/main/package.json")
      .then((r) => r.json())
      .then((p) => (document.getElementById("version").textContent = "v" + p.version))
      .catch(() => {});
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: http: data:">
  <title>Ambaser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chrome">
    <div class="tab-strip">
      <div id="window-buttons" class="window-buttons" hidden>
        <button class="light light-close" data-window="close" data-icon="close" title="Close"></button>
        <button class="light light-minimize" data-window="minimize" data-icon="minus" title="Minimize"></button>
        <button class="light light-fullscreen" data-window="fullscreen" data-icon="expand" title="Full screen"></button>
      </div>
      <div id="tabs" class="tabs"></div>
      <button id="new-tab" class="icon-btn" title="New tab" data-icon="plus"></button>
      <span id="incognito-badge" class="badge" hidden>Incognito</span>
    </div>
    <div class="toolbar">
      <button id="back" class="icon-btn" title="Back" data-icon="back"></button>
      <button id="forward" class="icon-btn" title="Forward" data-icon="forward"></button>
      <button id="reload" class="icon-btn" title="Reload" data-icon="reload"></button>
      <button id="home" class="icon-btn" title="Home" data-icon="home"></button>
      <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Search Google or enter a web address">
      <button id="pin" class="icon-btn" title="Pin this page" data-icon="star"></button>
      <button id="history-btn" class="icon-btn" title="History" data-icon="clock"></button>
      <button id="incognito-btn" class="icon-btn" title="New incognito window (Ctrl+Shift+N)" data-icon="incognito"></button>
      <button id="devtools-btn" class="icon-btn" title="Developer tools (F12)" data-icon="code"></button>
      <button id="settings-btn" class="icon-btn" title="Settings" data-icon="sliders"></button>
    </div>
    <div id="favorites" class="favorites"></div>
  </div>
  <div id="dropdown" class="dropdown" hidden></div>
  <div id="find" class="find" hidden>
    <input id="find-text" class="field" type="text" spellcheck="false" autocomplete="off" placeholder="Find in page">
    <span id="find-count" class="find-count"></span>
    <button id="find-prev" class="icon-btn" title="Previous" data-icon="back"></button>
    <button id="find-next" class="icon-btn" title="Next" data-icon="forward"></button>
    <button id="find-close" class="icon-btn" title="Close" data-icon="close"></button>
  </div>
  <div id="preview" class="preview" hidden>
    <img id="preview-image" alt="">
    <div id="preview-title" class="preview-title"></div>
    <div id="preview-url" class="preview-url"></div>
  </div>
  <div id="group-editor" class="group-editor" hidden>
    <input id="group-name" class="field" type="text" maxlength="30" spellcheck="false" autocomplete="off" placeholder="Group name">
    <div id="group-colors" class="choices"></div>
    <div id="group-icons" class="choices"></div>
    <div class="editor-actions">
      <button id="group-ungroup" class="text-btn">Ungroup</button>
      <button id="group-close" class="text-btn">Close group</button>
    </div>
  </div>
  <div id="history-panel" class="history-panel" hidden>
    <div class="history-body">
      <div class="history-head">
        <h1>History</h1>
        <button id="history-clear" class="text-btn"></button>
        <button id="history-close" class="icon-btn" title="Close" data-icon="close"></button>
      </div>
      <input id="history-filter" class="field" type="text" spellcheck="false" autocomplete="off" placeholder="Search history">
      <div id="history-list"></div>
    </div>
  </div>
  <div id="settings-panel" class="history-panel" hidden>
    <form id="settings-form" class="history-body">
      <div class="history-head">
        <h1>Settings</h1>
        <button id="settings-close" type="button" class="icon-btn" title="Close" data-icon="close"></button>
      </div>
      <label class="setting">Proxy
        <select id="proxy-mode" class="field">
          <option value="system">Use the system setting</option>
          <option value="direct">No proxy</option>
          <option value="manual">Manual</option>
        </select>
      </label>
      <label class="setting">Proxy server
        <input id="proxy-server" class="field" type="text" spellcheck="false" autocomplete="off" placeholder="127.0.0.1:8080 or socks5://host:1080">
      </label>
      <label class="setting">Skip the proxy for
        <input id="proxy-bypass" class="field" type="text" spellcheck="false" autocomplete="off" placeholder="*.local, 10.0.0.0/8">
      </label>
      <label class="setting">DNS
        <select id="dns-mode" class="field">
          <option value="cloudflare">Cloudflare 1.1.1.1</option>
          <option value="system">Use the system DNS</option>
          <option value="custom">Custom (DNS over HTTPS)</option>
        </select>
      </label>
      <label class="setting">DNS server
        <input id="dns-url" class="field" type="text" spellcheck="false" autocomplete="off" placeholder="https://dns.google/dns-query">
      </label>
      <p class="note">These apply to this app only. If a secure DNS server cannot be reached, the system DNS is used. With a proxy, the proxy usually looks names up itself. Proxies that ask for a password are not supported.</p>
      <div class="setting">Clear browsing data
        <div class="clear-actions">
          <button type="button" class="text-btn" data-clear="cache">Cache</button>
          <button type="button" class="text-btn" data-clear="cookies">Cookies and site data</button>
          <button type="button" class="text-btn" data-clear="history">History</button>
          <button type="button" class="text-btn danger" data-clear="all">Everything</button>
        </div>
      </div>
      <div class="history-head">
        <span id="settings-status" class="note" role="status"></span>
        <button type="submit" class="text-btn">Save</button>
      </div>
    </form>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
